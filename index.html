<style>
  :root{
    --bg:#15132a; --panel:#201e3c; --tile:#2f2c55; --tile-lo:#191634;
    --edge:#453f75; --ink:#f4efe2; --dim:#8b86b8;
    --p1:#e8402a; --amber:#f2b33d; --ok:#3fbf7f; --ng:#b8384a;
    --jp:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--jp);
    min-height:100vh;display:flex;justify-content:center;padding:20px 14px 50px;
    -webkit-font-smoothing:antialiased}
  .cab{width:100%;max-width:680px}

  .marquee{border:2px solid var(--tile);border-bottom-width:4px;background:var(--panel);
    padding:12px 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .marquee h1{font-size:19px;font-weight:800;letter-spacing:.14em;line-height:1}
  .marquee .sub{font-size:11px;color:var(--dim);letter-spacing:.24em}

  .status{display:flex;gap:2px;margin-top:2px}
  .status div{flex:1;background:var(--tile-lo);border:2px solid var(--tile);
    padding:7px 10px;display:flex;justify-content:space-between;align-items:baseline}
  .status .k{font-size:10px;letter-spacing:.2em;color:var(--dim)}
  .status .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}

  .stage{background:var(--panel);border:2px solid var(--tile);border-top:none;padding:18px 14px 20px}
  .stage.top{border-top:2px solid var(--tile)}

  /* ---- 盤面 ---- */
  .parts{display:flex;flex-direction:column;gap:8px;align-items:center}
  .cell{background:repeating-linear-gradient(45deg,var(--tile-lo) 0 5px,#221f45 5px 10px);
    border:1px solid var(--edge);color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;line-height:1.15;word-break:break-all;position:relative;
    cursor:pointer;font:inherit;padding:2px}
  .cell.filled{background:var(--tile)}
  .cell.over{border-color:var(--amber);background:#3b3767}
  .cell.active::after{content:"";position:absolute;inset:-5px;border:3px solid var(--p1);
    animation:blink .62s steps(2,start) infinite;pointer-events:none;z-index:5}
  @keyframes blink{50%{opacity:.15}}
  @media(prefers-reduced-motion:reduce){.cell.active::after{animation:none}}
  .cell.hit{background:#1d3d2e;border-color:var(--ok);color:var(--ok)}
  .cell.miss{background:#3a1c26;border-color:var(--ng);color:#ffb9c2}
  .cell b{display:block;font-weight:700;color:var(--ok);font-size:9px;margin-top:2px}

  .row{display:flex;gap:5px;justify-content:center;width:100%}
  .row .cell,.row .spacer{flex:1 1 0;min-width:0}
  .row.grid>.cell,.row.grid>.spacer{flex:0 0 calc((100% - (var(--cols) - 1) * 5px) / var(--cols))}
  .row .cell{min-height:48px;font-size:10.5px;box-shadow:2px 2px 0 var(--tile-lo)}
  .cols{display:flex;gap:5px;justify-content:center;width:100%;align-items:flex-start}
  .colstack{display:flex;flex-direction:column;gap:5px;flex:1 1 0;min-width:0}
  .colstack .cell{min-height:48px;font-size:10.5px;box-shadow:2px 2px 0 var(--tile-lo)}
  .cols.oval .cell{border-radius:50%;width:64px;height:70px;min-height:0;align-self:center;
    padding:2px;font-size:9.5px;box-shadow:none}
  .cols.oval .cell.active::after{border-radius:50%;inset:-4px}
  .cell.locked{background:var(--tile-lo);color:#5f5a86;cursor:default;font-size:9.5px;
    box-shadow:none}

  .circlewrap{position:relative;width:100%;display:flex;justify-content:center}
  .ringbox{position:relative;transform-origin:top center}
  .ringbox .core{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;
    border-radius:50%;border:2px solid var(--edge);background:var(--tile-lo);
    display:flex;align-items:center;justify-content:center;font-size:9.5px;
    letter-spacing:.12em;color:var(--dim);text-align:center;line-height:1.4}
  .rt{position:absolute;left:50%;top:50%;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}
  .rt>.lb{display:block;font-size:9.5px;transform:rotate(var(--back))}
  /* clip-path は外側の ::after も切り落とすので、円のタイルは枠を内側に描く */
  .rt.active{background:#3b3767}
  .rt.active::after{inset:0;border-width:4px}

  /* ---- 手札 / 入力 ---- */
  .pool{margin-top:16px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;
    border-top:1px solid var(--tile);padding-top:14px}
  .chip{font:inherit;font-size:12px;color:var(--ink);background:var(--tile);
    border:1px solid var(--edge);box-shadow:2px 2px 0 var(--tile-lo);
    padding:7px 10px;cursor:grab}
  .chip:hover{background:#3b3767}
  .chip.sel{background:var(--amber);color:#241a05;border-color:var(--amber);font-weight:700}
  .chip:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .typer{margin-top:16px;border-top:1px solid var(--tile);padding-top:14px;display:flex;gap:6px}
  .typer input{flex:1;font:inherit;font-size:15px;background:var(--tile-lo);color:var(--ink);
    border:1px solid var(--edge);padding:11px 12px;min-width:0}
  .typer input:focus{outline:2px solid var(--amber);outline-offset:-2px}
  .hint{margin-top:9px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.7}

  /* ---- 共通UI ---- */
  .list{display:grid;gap:6px}
  .list button{font:inherit;text-align:left;color:var(--ink);background:var(--panel);
    border:2px solid var(--tile);border-left:5px solid var(--amber);padding:13px 15px;
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .list button:hover{background:#2a2750}
  .list button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .list button.col{flex-direction:column;align-items:flex-start;gap:0}
  .list .nm{font-size:15px;font-weight:700}
  .list .mt{font-size:11px;color:var(--dim);letter-spacing:.08em;white-space:nowrap;text-align:right}
  .list .ds{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.6}
  .note{margin-top:16px;font-size:11.5px;line-height:1.75;color:var(--dim);
    border-top:1px solid var(--tile);padding-top:12px}
  .flag{color:var(--amber)}
  .result{text-align:center;padding:22px 10px 6px}
  .result .big{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .result .lbl{font-size:11px;letter-spacing:.26em;color:var(--dim);margin-bottom:8px}
  .result .det{font-size:13px;color:var(--dim);margin-top:12px;line-height:1.8}
  .bar{margin-top:18px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .bar button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--tile);
    border:1px solid var(--edge);box-shadow:2px 2px 0 var(--tile-lo);padding:11px 20px;cursor:pointer}
  .bar button.go{background:var(--amber);color:#241a05;border-color:var(--amber)}
  .bar button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  footer{margin-top:14px;font-size:10.5px;line-height:1.8;color:#5f5a86;text-align:center}
</style>
</head>

        {dy:0, names:[
          "ユン|Yun","レミー|Remy","Q|キュー","春麗|チュンリー|Chun-Li",
          "まこと|Makoto","トゥエルヴ|トゥエルブ|Twelve","ヤン|Yang"]},
        {dy:38, names:[
          "リュウ|Ryu","オロ|Oro","ダッドリー|Dudley",
          "エレナ|Elena","ヒューゴー|ヒューゴ|Hugo","ケン|Ken"]}
      ]}
    ]
  },
  {
    id:"gradius3_sfc", name:"グラディウスIII (SFC) 武器選択", meta:"1990 / 24種", verified:true,
    parts:[
      /* 1行目は列の見出し。選択対象は6カテゴリ×4種の24種 */
      {type:"row", w:660, cols:6, names:[
        "=ミサイル","=ダブル","=レーザー","=オプション","=？","=！"]},
      {type:"row", w:660, cols:6, names:[
        "ミサイル|Missile","バーティカル|バーチカル|Vertical","ツインレーザー|ツイン|Twin Laser",
        "オプション|Option","シールド|Shield","スピードダウン|Speed Down"]},
      {type:"row", w:660, cols:6, names:[
        "ホークウィンド|ホークウインド|Hawk Wind","ダブル|Double","リップル|リップルレーザー|Ripple",
        "S.オプション|Sオプション|スネークオプション|スネーク|Snake Option|S.Option",
        "フォースフィールド|Force Field",
        "リメインオプション|Remain Option|リメイン"]},
      {type:"row", w:660, cols:6, names:[
        "2way back|2WAYバック|ツーウェイバック|2 Way Back","テイルガン|テールガン|Tailgun",
        "E.レーザー|Eレーザー|エナジーレーザー|エナジー|Energy Laser|E.Laser",
        "F.オプション|Fオプション|フォーメーションオプション|フォーメーション|Formation Option|F.Option",
        "Rシールド|R.シールド|R.Shield","フルバリア|Full Barrier"]},
      {type:"row", w:660, cols:6, names:[
        "スモールスプレッド|Small Spread","バックダブル|Back Double",
        "C.レーザー|Cレーザー|サイクロンレーザー|サイクロン|Cyclone Laser|C.Laser",
        "R.オプション|Rオプション|ローリングオプション|ローリング|Rolling Option|R.Option",
        "レデュース|Reduce","メガクラッシュ|Mega Crush"]}
    ]
  }
];

/* ========================================================================== */
const app = document.getElementById("app");
const PAR = 300;
let GAMES = DATA;
let S = null;

const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

function norm(s){
  return String(s).toLowerCase()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[ぁ-ん]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60))
    .replace(/？/g,"?").replace(/！/g,"!")
    .replace(/[\s・･\-‐ー－=＝.。．、,，'"’”&＆()（）]/g,"");
}
const parse = s => { const p = String(s).split("|"); return {label:p[0], keys:p.map(norm)}; };
const rawNames = g => g.parts.flatMap(p =>
    p.type==="circle" ? p.rings.flatMap(r=>r.names)
  : p.type==="cols"   ? p.columns.flatMap(c=>c.names)
  : p.names)
  .filter(n => n && String(n)[0]!=="=");
const cellsOf = g => rawNames(g).map(parse);

/* 自己ベスト。file:// や制限環境では黙って無効化 */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const bestKey = (g,m) => `csm:best:${g.id}:${m}`;

/* ---------- 盤面描画 ---------- */
function board(g){
  let i = 0;
  const inner = p => {
    const a = S.ans[p]||"";
    if(!S.graded) return esc(a);
    return esc(a||"—") + (S.mark[p] ? "" : `<b>${esc(S.cells[p].label)}</b>`);
  };
  const klass = p => "cell" + (S.ans[p]?" filled":"")
    + (S.graded ? (S.mark[p]?" hit":" miss") : (p===S.active?" active":""));

  const html = g.parts.map(part=>{
    if(part.type==="cols"){
      const cls = "cols" + (part.shape==="oval" ? " oval" : "");
      const rot = part.tilt ? `transform:rotate(${part.tilt}deg);` : "";
      /* 回転した分だけ上下に余白を足して、隣の要素と重ならないようにする */
      const mg = part.tilt
        ? `margin:${Math.round(Math.abs(Math.sin(part.tilt*Math.PI/180))*(part.w||440)/2)+8}px 0;`
        : "";
      const st = (part.w?`max-width:${part.w}px;`:"") + rot + mg;
      return `<div class="${cls}"${st?` style="${st}"`:""}>${part.columns.map(col=>{
        const cs = col.dy ? ` style="margin-top:${col.dy}px"` : "";
        return `<div class="colstack"${cs}>${col.names.map(n=>{
          if(!n) return `<div class="spacer" style="min-height:48px"></div>`;
          if(String(n)[0]==="=") return `<div class="cell locked">${esc(String(n).slice(1))}</div>`;
          const p=i++;
          return `<button type="button" class="${klass(p)}" data-c="${p}">${inner(p)}</button>`;
        }).join("")}</div>`;
      }).join("")}</div>`;
    }
    if(part.type==="row"){
      const st = (part.w?`max-width:${part.w}px;`:"") + (part.cols?`--cols:${part.cols}`:"");
      const cls = "row" + (part.cols?" grid":"");
      return `<div class="${cls}"${st?` style="${st}"`:""}>${part.names.map(n=>{
        if(!n) return `<div class="spacer"></div>`;
        if(String(n)[0]==="=") return `<div class="cell locked">${esc(String(n).slice(1))}</div>`;
        const p=i++;
        return `<button type="button" class="${klass(p)}" data-c="${p}">${inner(p)}</button>`;
      }).join("")}</div>`;
    }
    const size = part.size||470, tw = 66, th = 50;
    let t = "";
    for(const ring of part.rings){
      const step = 360/ring.names.length;
      ring.names.forEach((nm,k)=>{
        if(!nm) return;
        const a = Array.isArray(ring.at) ? ring.at[k] : (ring.from||0) + step*k;
        const pos = `width:${tw}px;height:${th}px;margin:${-th/2}px 0 0 ${-tw/2}px;`
                  + `transform:rotate(${a}deg) translateY(${-ring.r}px);--back:${-a}deg`;
        if(String(nm)[0]==="="){
          t += `<div class="cell locked rt" style="${pos}">`
             + `<span class="lb">${esc(String(nm).slice(1))}</span></div>`;
          return;
        }
        const p = i++;
        t += `<button type="button" class="${klass(p)} rt" data-c="${p}" style="${pos}">`
           + `<span class="lb">${inner(p)}</span></button>`;
      });
    }
    return `<div class="circlewrap"><div class="ringbox" style="width:${size}px;height:${size}px">`
         + `<div class="core">${esc(part.core||"RANDOM").replace(/\n/g,"<br>")}</div>${t}</div></div>`;
  }).join("");

  return `<div class="parts">${html}</div>`;
}

function fit(){
  app.querySelectorAll(".ringbox").forEach(rb=>{
    const s = Math.min(1, rb.parentElement.clientWidth / parseFloat(rb.style.width));
    rb.style.transform = `scale(${s})`;
    rb.parentElement.style.height = (parseFloat(rb.style.height)*s)+"px";
  });
  app.querySelectorAll(".row[style]").forEach(r=>{
    const parts = r.parentElement;
    r.style.maxWidth = Math.min(parseFloat(r.dataset.w||r.style.maxWidth), parts.clientWidth)+"px";
  });
}
addEventListener("resize", fit);

/* ---------- 画面 ---------- */
function title(){
  clearInterval(S?.t);
  app.innerHTML = `<div class="stage top">
    <div class="list">${GAMES.map(g=>{
      const b = ["drag","type"].map(m=>store.get(bestKey(g,m))).filter(Boolean);
      const top = b.length ? Math.max(...b.map(x=>x.score)) : null;
      return `<button data-g="${esc(g.id)}">
        <span class="nm">${esc(g.name)}</span>
        <span class="mt">${esc(g.meta||"")}${g.verified?"":" ⚠"}
          ${top!=null?`<br>自己ベスト ${top}`:""}</span></button>`;
    }).join("")}</div>
    <p class="note">空のキャラ選択画面を、記憶だけで埋めてください。</p>
  </div>`;
  app.querySelectorAll("[data-g]").forEach(b=>
    b.onclick=()=>modeSelect(GAMES.find(g=>g.id===b.dataset.g)));
}

function modeSelect(g){
  const bd = store.get(bestKey(g,"drag")), bt = store.get(bestKey(g,"type"));
  app.innerHTML = `<div class="stage top">
    <div class="list">
      <button class="col" data-m="drag">
        <span class="nm">並べる</span>
        <span class="ds">キャラ名が全部下に並びます。正しいマスへ置いてください。
          ${bd?`<br>自己ベスト ${bd.score}点 / ${bd.hit}正解 / ${mmss(bd.sec)}`:""}</span></button>
      <button class="col" data-m="type">
        <span class="nm">記入する</span>
        <span class="ds">選択肢はありません。マスを選んで名前を打ち込んでください。
          ${bt?`<br>自己ベスト ${bt.score}点 / ${bt.hit}正解 / ${mmss(bt.sec)}`:""}</span></button>
    </div>
    <p class="note">${esc(g.name)} / 全${cellsOf(g).length}マス<br>
      ${PAR}秒以内に終えると時間ボーナスが付きます。</p>
    <div class="bar"><button id="bk">戻る</button></div>
  </div>`;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>start(g,b.dataset.m));
  document.getElementById("bk").onclick = title;
}

function start(g, mode){
  const cells = cellsOf(g);
  S = { g, mode, cells, ans:cells.map(()=>null), mark:cells.map(()=>false),
        pool:shuffle(cells.map(c=>c.label)), held:null, active:0, graded:false, sec:0, t:null };
  S.t = setInterval(()=>{ S.sec++;
    const e=document.getElementById("tm"); if(e) e.textContent = mmss(S.sec); },1000);
  play();
}

function play(){
  const left = S.ans.filter(a=>!a).length;
  const used = new Set(S.ans.filter(Boolean));
  const rest = S.pool.filter(n=>!used.has(n));

  const ctrl = S.mode==="drag"
    ? `<div class="pool">${rest.map(n=>
        `<button type="button" class="chip${S.held===n?" sel":""}" data-p="${esc(n)}" draggable="true">${esc(n)}</button>`
       ).join("") || '<span class="hint">手札は空です。答え合わせへどうぞ。</span>'}</div>
       <p class="hint">名札をタップしてからマスをタップ、またはドラッグして置きます。<br>
         置いたマスをもう一度タップすると手札に戻ります。</p>`
    : `<div class="typer">
         <input id="tx" placeholder="選択中のマスに入る名前" autocomplete="off" spellcheck="false">
         <button class="chip" id="ok" style="padding:11px 16px">決定</button>
       </div>
       <p class="hint">Enterで確定し、次の空きマスへ進みます。表記ゆれや別名も判定します。</p>`;

  app.innerHTML = `
    <div class="status">
      <div><span class="k">残り</span><span class="v">${left}</span></div>
      <div><span class="k">TIME</span><span class="v" id="tm">${mmss(S.sec)}</span></div>
    </div>
    <div class="stage">
      ${board(S.g)}
      ${ctrl}
      <div class="bar">
        <button class="go" id="gr">答え合わせ</button>
        <button id="qt">やめる</button>
      </div>
    </div>`;
  fit();
  bind();
}

function bind(){
  app.querySelectorAll("[data-c]").forEach(el=>{
    const p = +el.dataset.c;
    el.onclick = ()=>{
      if(S.mode==="drag"){
        if(S.ans[p]){ S.ans[p]=null; play(); return; }
        if(S.held){ S.ans[p]=S.held; S.held=null; play(); }
      }else{
        S.active = p; play();
        const tx = document.getElementById("tx");
        if(tx){ tx.value = S.ans[p]||""; tx.focus(); tx.select(); }
      }
    };
    if(S.mode!=="drag") return;
    el.ondragover = e=>{ e.preventDefault(); el.classList.add("over"); };
    el.ondragleave = ()=> el.classList.remove("over");
    el.ondrop = e=>{ e.preventDefault();
      const n = e.dataTransfer.getData("text/plain");
      if(n){ S.ans[p]=n; S.held=null; play(); } };
  });

  app.querySelectorAll("[data-p]").forEach(el=>{
    const n = el.dataset.p;
    el.onclick = ()=>{ S.held = (S.held===n ? null : n); play(); };
    el.ondragstart = e=>{ e.dataTransfer.setData("text/plain", n); S.held=null; };
  });

  const tx = document.getElementById("tx");
  if(tx){
    const commit = ()=>{
      const v = tx.value.trim();
      if(v && S.active!=null){
        S.ans[S.active] = v;
        let n = S.ans.findIndex((a,i)=>!a && i>S.active);
        if(n<0) n = S.ans.findIndex(a=>!a);
        if(n>=0) S.active = n;
      }
      play();
      const t2 = document.getElementById("tx"); if(t2) t2.focus();
    };
    tx.onkeydown = e=>{ if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); commit(); } };
    document.getElementById("ok").onclick = commit;
    tx.focus();
  }
  document.getElementById("gr").onclick = grade;
  document.getElementById("qt").onclick = ()=>{ clearInterval(S.t); title(); };
}

function grade(){
  clearInterval(S.t);
  S.graded = true; S.active = null;
  S.mark = S.cells.map((c,i)=> !!S.ans[i] && c.keys.includes(norm(S.ans[i])));
  const hit = S.mark.filter(Boolean).length, n = S.cells.length;
  const bonus = Math.round(Math.max(0, PAR - S.sec) * (hit/n));
  const score = hit*100 + bonus;

  const key = bestKey(S.g, S.mode), prev = store.get(key);
  const isBest = !prev || score > prev.score;
  if(isBest) store.set(key, {score, hit, sec:S.sec});

  app.innerHTML = `
    <div class="status">
      <div><span class="k">正解</span><span class="v">${hit}/${n}</span></div>
      <div><span class="k">TIME</span><span class="v">${mmss(S.sec)}</span></div>
    </div>
    <div class="stage">
      ${board(S.g)}
      <div class="result">
        <p class="lbl">SCORE</p><p class="big">${score}</p>
        <p class="det">正解 ${hit}×100 ＋ 時間ボーナス ${bonus}
          ${isBest?'<br><span class="flag">自己ベスト更新</span>':(prev?`<br>自己ベスト ${prev.score}`:"")}</p>
      </div>
      <div class="bar">
        <button class="go" id="rt">もう一度</button>
        <button id="hm">タイトルへ</button>
      </div>
    </div>`;
  fit();
  document.getElementById("rt").onclick = ()=>start(S.g, S.mode);
  document.getElementById("hm").onclick = title;
}

title();
</script>
</body>
</html>
